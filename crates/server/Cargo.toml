[package]
name = "vulnwatch-server"
description = "vulnwatch daemon: checks for vulnerabilities and serves the web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vulnwatch"
path = "src/main.rs"

[dependencies]
vulnwatch-core = { path = "../core" }
anyhow = "1"
log = "0.4"
serde_json = "1"
tiny_http = "0.12"
include_dir = "0.7"
